<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0c2219" />
<title>Hedge or Pledge</title>
<style>
:root {
  --forest: #16382b;
  --forest-deep: #0b1f18;
  --forest-mid: #1e4a38;
  --leaf: #2c6b4a;
  --mint: #3d8f62;
  --gold: #e0b422;
  --gold-2: #f3d056;
  --gold-deep: #b8860b;
  --cream: #f3ead6;
  --cream-2: #e7dcc3;
  --paper: #fffbf2;
  --ink: #14241c;
  --ink-soft: #3d5248;
  --muted: #7a8c82;
  --line: #d9ccb0;
  --heart: #e25b4a;
  --heart-empty: #d4c6ae;
  --right: #2c9a62;
  --right-bg: #dff6e9;
  --wrong: #c94a3a;
  --wrong-bg: #fde8e4;
  --locked: #a9b8ae;
  --shadow: 0 12px 40px rgba(8, 24, 16, .35);
  --nav-h: 68px;
  --font: ui-rounded, "Avenir Next", "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
  --display: Palatino, "Palatino Linotype", "Book Antiqua", Georgia, serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(224,180,34,.16), transparent 55%),
    radial-gradient(circle at 12% 88%, rgba(45,107,74,.45), transparent 42%),
    radial-gradient(circle at 92% 70%, rgba(184,134,11,.12), transparent 38%),
    var(--forest-deep);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
input { font: inherit; color: inherit; }
#app {
  width: 100%;
  max-width: 420px;
  height: 100dvh;
  margin: 0 auto;
  background:
    linear-gradient(180deg, rgba(255,251,242,.6), transparent 120px),
    var(--cream);
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
}
@media (min-width: 480px) {
  body { padding: 24px 0; }
  #app {
    height: calc(100dvh - 48px);
    border-radius: 36px;
    border: 3px solid #2a5a42;
  }
}
/* header */
.top, .tagline, .g-search, .fine, .l-top, .foot, .sheet { flex-shrink: 0; }
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 8px;
  gap: 8px;
}
.brand {
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -.02em;
  color: var(--forest);
  line-height: 1.1;
}
.brand em { color: var(--gold-deep); font-style: normal; }
.stats {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
  white-space: nowrap;
}
.stat {
  display: flex;
  align-items: center;
  gap: 4px;
  font-weight: 800;
  font-size: 14px;
  color: var(--forest);
}
.stat .ic { font-size: 16px; line-height: 1; }
.stat.xp { color: var(--gold-deep); }
.stat.streak { color: #d35400; }
.stat.hearts { color: var(--heart); }
.tagline {
  padding: 0 18px 12px;
  color: var(--ink-soft);
  font-size: 13.5px;
  line-height: 1.35;
}
/* path */
.scroll {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 8px 18px 16px;
  -webkit-overflow-scrolling: touch;
}
.unit-banner {
  background: linear-gradient(180deg, #234d3a, #16382b);
  color: var(--cream);
  border-radius: 18px;
  padding: 14px 16px 12px;
  margin: 18px 0 14px;
  box-shadow: 0 4px 0 #0b1f18;
  position: relative;
}
.unit-banner .kicker {
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--gold-2);
  font-weight: 800;
}
.unit-banner h2 {
  font-family: var(--display);
  font-size: 20px;
  margin-top: 2px;
}
.unit-banner p { font-size: 13px; opacity: .8; margin-top: 4px; }
.path {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 22px;
  padding: 8px 0 16px;
  position: relative;
}
.path::before {
  content: "";
  position: absolute;
  top: 12px; bottom: 12px; left: 50%;
  width: 6px;
  margin-left: -3px;
  background: repeating-linear-gradient(
    180deg,
    #c4b48a 0 10px,
    transparent 10px 18px
  );
  border-radius: 4px;
  z-index: 0;
}
.node-wrap {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}
.node {
  width: 74px; height: 74px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 22px;
  position: relative;
  border: 4px solid #c9b892;
  background: #efe4c8;
  color: var(--muted);
  box-shadow: 0 6px 0 #b9a67a;
  transition: transform .12s ease;
}
.node:active { transform: translateY(3px); box-shadow: 0 3px 0 #b9a67a; }
.node.done {
  background: linear-gradient(180deg, #3d8f62, #2c6b4a);
  border-color: #1e4a38;
  color: #fff;
  box-shadow: 0 6px 0 #16382b;
}
.node.next {
  background: linear-gradient(180deg, var(--gold-2), var(--gold));
  border-color: var(--gold-deep);
  color: var(--forest-deep);
  box-shadow: 0 6px 0 var(--gold-deep);
  animation: pulse 1.8s ease-in-out infinite;
}
.node.locked { cursor: default; }
.node.review { border-radius: 18px; }
.node-label {
  margin-top: 8px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--ink-soft);
  text-align: center;
  max-width: 140px;
  line-height: 1.25;
}
.node.next + .node-label, .node-wrap.next .node-label { color: var(--gold-deep); font-weight: 800; }
@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.06); }
}
.lock { font-size: 22px; }
/* bottom nav */
.nav {
  flex-shrink: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--paper);
  border-top: 2px solid var(--line);
  display: flex;
  z-index: 8;
}
.nav b {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.nav b.on { color: var(--gold-deep); }
.nav svg { width: 26px; height: 26px; }
/* lesson */
.lesson {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  height: 100%;
  background: var(--cream);
}
.l-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px 8px;
}
.xbtn {
  width: 40px; height: 40px;
  border-radius: 12px;
  font-size: 22px;
  color: var(--muted);
  font-weight: 700;
}
.pips {
  flex: 1;
  display: flex;
  gap: 4px;
  height: 10px;
  align-items: center;
}
.pip {
  flex: 1;
  height: 8px;
  border-radius: 8px;
  background: var(--cream-2);
}
.pip.on { background: var(--leaf); }
.pip.now { background: var(--gold); }
.hearts { display: flex; gap: 3px; font-size: 16px; }
.prompt {
  flex: 1;
  padding: 8px 20px 16px;
  overflow-y: auto;
}
.kicker2 {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--gold-deep);
  margin-bottom: 8px;
}
.stem {
  font-size: 22px;
  font-weight: 800;
  line-height: 1.25;
  letter-spacing: -.02em;
  margin-bottom: 16px;
}
.story {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 18px;
  padding: 14px 16px;
  font-size: 16px;
  line-height: 1.45;
  margin-bottom: 14px;
  color: var(--ink);
}
.story .blank {
  display: inline-block;
  min-width: 72px;
  border-bottom: 3px solid var(--gold-deep);
  color: var(--gold-deep);
  font-weight: 800;
  text-align: center;
  padding: 0 4px;
}
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt, .bank-chip, .mchip {
  min-height: 54px;
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  border-radius: 16px;
  background: var(--paper);
  padding: 12px 14px;
  text-align: left;
  font-size: 15.5px;
  font-weight: 700;
  line-height: 1.3;
}
.opt.sel, .bank-chip.sel, .mchip.sel {
  border-color: var(--gold-deep);
  background: #fff6d4;
  color: var(--forest);
}
.opt.good, .mchip.good, .bank-chip.good {
  border-color: var(--right);
  background: var(--right-bg);
}
.opt.bad, .bank-chip.bad {
  border-color: var(--wrong);
  background: var(--wrong-bg);
}
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { text-align: center; font-size: 18px; font-weight: 800; min-height: 64px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.bank-chip { min-width: 96px; text-align: center; font-weight: 800; }
.match {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
}
.mchip { text-align: center; font-weight: 800; }
.mchip.shake { animation: shake .38s ease; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}
.foot {
  padding: 12px 18px calc(16px + env(safe-area-inset-bottom, 0px));
}
.btn {
  width: 100%;
  min-height: 56px;
  border-radius: 16px;
  font-weight: 800;
  font-size: 17px;
  letter-spacing: .04em;
  text-transform: uppercase;
  border-bottom: 4px solid rgba(0,0,0,.18);
}
.btn:active { transform: translateY(3px); border-bottom-width: 1px; }
.btn:disabled { opacity: .4; transform: none; }
.btn-gold {
  background: linear-gradient(180deg, var(--gold-2), var(--gold));
  color: var(--forest-deep);
  border-bottom-color: var(--gold-deep);
}
.btn-green {
  background: linear-gradient(180deg, #45b574, var(--leaf));
  color: #fff;
  border-bottom-color: #1e4a38;
}
.btn-red {
  background: linear-gradient(180deg, #e36b5c, var(--wrong));
  color: #fff;
  border-bottom-color: #8e2f24;
}
.btn-ghost {
  background: transparent;
  border: 2px solid var(--line);
  border-bottom-width: 4px;
  color: var(--ink-soft);
  margin-top: 8px;
}
.sheet {
  padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px));
  border-top: 2px solid transparent;
}
.sheet.ok { background: var(--right-bg); }
.sheet.no { background: var(--wrong-bg); }
.sheet h3 {
  font-size: 20px;
  font-weight: 800;
  margin-bottom: 4px;
}
.sheet.ok h3 { color: var(--right); }
.sheet.no h3 { color: var(--wrong); }
.sheet p { font-size: 15px; line-height: 1.4; color: var(--ink); margin-bottom: 12px; }
/* complete / fail */
.hero {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  padding: 28px 22px calc(20px + env(safe-area-inset-bottom, 0px));
  text-align: center;
}
.hero h1 {
  font-family: var(--display);
  font-size: 32px;
  margin: 8px 0 6px;
}
.hero .sub { color: var(--ink-soft); margin-bottom: 18px; }
.xp-card {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 20px;
  padding: 14px;
  text-align: left;
  margin-bottom: 16px;
}
.xp-row {
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  padding: 6px 0;
  font-size: 15px;
}
.xp-row.total { border-top: 2px solid var(--line); margin-top: 6px; padding-top: 10px; color: var(--gold-deep); font-size: 17px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 18px; }
.chip {
  background: #fff6d4;
  border: 2px solid var(--gold-deep);
  color: var(--forest);
  border-radius: 999px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 800;
}
.mascot { font-size: 64px; line-height: 1; filter: drop-shadow(0 6px 0 rgba(0,0,0,.08)); }
/* glossary */
.g-search {
  margin: 4px 16px 10px;
}
.g-search input {
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  border: 2px solid var(--line);
  background: var(--paper);
  padding: 0 14px;
  font-size: 16px;
}
.g-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 0 16px 12px;
}
.g-card {
  background: var(--paper);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
  margin-bottom: 10px;
}
.g-card h3 {
  font-size: 17px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.seen { color: var(--right); font-size: 16px; }
.g-card .def { font-size: 14.5px; margin: 6px 0; line-height: 1.4; }
.g-card .ex, .g-card .mu {
  font-size: 13px;
  color: var(--ink-soft);
  line-height: 1.4;
  margin-top: 4px;
}
.g-card .mu strong { color: var(--gold-deep); }
.fine {
  font-size: 11.5px;
  color: var(--muted);
  text-align: center;
  padding: 8px 20px 20px;
}
.prac-hero { padding: 28px 22px 20px; text-align: center; flex: 1; }
.prac-hero h1 { font-family: var(--display); font-size: 28px; margin: 8px 0; }
.bit {
  position: absolute;
  left: 50%; top: 30%;
  width: 8px; height: 14px;
  border-radius: 2px;
  pointer-events: none;
  z-index: 40;
  animation: pop 1.15s ease-out forwards;
}
@keyframes pop {
  to { transform: translate(var(--x), 55vh) rotate(var(--r)); opacity: 0; }
}
.hidden { display: none !important; }
.unit-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: -8px; }
svg.icon { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>

<div id="app"></div>
<script>
(function () {
"use strict";

const STORE_KEY = "hedge-or-pledge-v1";

/* ========== TERMS ========== */
const TERMS = {
  hedge: {
    id: "hedge", unit: 1, term: "hedge",
    definition: "Insurance on a bet you already have.",
    example: "You own $100,000 of stock and buy a put so a crash hurts less.",
    mixUp: "pledge",
    mixUpWhy: "A hedge protects what you own. A pledge puts it up as collateral."
  },
  pledge: {
    id: "pledge", unit: 1, term: "pledge",
    definition: "Put an asset up so a lender can take it if you don't pay.",
    example: "You pledge $1M of stock for a $700k loan. You still own the stock — until you don't pay.",
    mixUp: "hedge",
    mixUpWhy: "You still own it. Pledge = collateral. Sell = it's gone."
  },
  collateral: {
    id: "collateral", unit: 1, term: "collateral",
    definition: "The thing the lender can seize if you skip payments.",
    example: "The pledged stock is the collateral. Miss the loan, the bank takes the shares.",
    mixUp: "haircut",
    mixUpWhy: "Collateral is the asset. The haircut is how much they knock off its value before lending."
  },
  haircut: {
    id: "haircut", unit: 1, term: "haircut",
    definition: "The discount a lender applies to collateral before they'll lend against it.",
    example: "$1M stock, 30% haircut → they treat it as $700k. That's the max loan.",
    mixUp: "margin",
    mixUpWhy: "Haircut is the discount on collateral. Margin is the cash cushion you must keep."
  },
  margin: {
    id: "margin", unit: 1, term: "margin",
    definition: "Cash or equity you must keep in the account as a cushion.",
    example: "Broker lets you buy $10k of stock with $5k cash. That $5k is margin.",
    mixUp: "leverage",
    mixUpWhy: "Margin is the cushion. Leverage is the size of the bet that cushion supports."
  },
  "margin call": {
    id: "margin call", unit: 1, term: "margin call",
    definition: "The lender demanding more cash — or selling you out — because the cushion got too thin.",
    example: "Stock drops 40%. Collateral is now $600k against a $700k loan. The bank calls.",
    mixUp: "haircut",
    mixUpWhy: "The haircut was set at the start. A margin call happens later, when prices move against you."
  },
  leverage: {
    id: "leverage", unit: 2, term: "leverage",
    definition: "Using borrowed money or derivatives to make a bigger bet than your cash.",
    example: "$10k of yours plus $40k borrowed = 5× leverage. A 10% drop wipes half your cash.",
    mixUp: "margin",
    mixUpWhy: "Leverage is the multiplier. Margin is the cushion that makes the multiplier possible."
  },
  derivative: {
    id: "derivative", unit: 2, term: "derivative",
    definition: "A contract whose value comes from something else — a stock, a rate, a barrel of oil.",
    example: "A put on Apple is a derivative. The put is not Apple stock; it just bets on Apple's price.",
    mixUp: "option",
    mixUpWhy: "An option is one kind of derivative. Futures and swaps are derivatives too."
  },
  option: {
    id: "option", unit: 2, term: "option",
    definition: "The right, not the obligation, to buy or sell something at a set price.",
    example: "Pay $3 for the right to sell a $100 stock at $90. That's an option. You can walk away.",
    mixUp: "futures",
    mixUpWhy: "An option you can abandon. A futures contract you must settle."
  },
  put: {
    id: "put", unit: 2, term: "put",
    definition: "An option to sell at a set price. Pays off when the thing falls.",
    example: "Stock at $100. A $90 put pays if it drops below $90. Crash insurance if you own it.",
    mixUp: "call",
    mixUpWhy: "Put = right to sell (you want it down). Call = right to buy (you want it up)."
  },
  call: {
    id: "call", unit: 2, term: "call",
    definition: "An option to buy at a set price. Pays off when the thing rises.",
    example: "Stock at $100. A $110 call pays if it rips above $110. That's a bullish bet.",
    mixUp: "put",
    mixUpWhy: "Call = right to buy (up). Put = right to sell (down)."
  },
  "short selling": {
    id: "short selling", unit: 2, term: "short selling",
    definition: "Borrow shares, sell them now, hope to buy back cheaper later.",
    example: "Borrow 100 shares, sell at $50, buy back at $30, return them. You keep $20. If it goes to $80, you owe.",
    mixUp: "put",
    mixUpWhy: "A put is a limited-loss down bet. A short can lose without a ceiling if the stock rips."
  },
  liquidity: {
    id: "liquidity", unit: 3, term: "liquidity",
    definition: "How fast you can sell without moving the price much.",
    example: "Apple stock is liquid — dump $1M and the price barely budges. Your cousin's startup is not.",
    mixUp: "notional",
    mixUpWhy: "Liquidity is ease of exit. Notional is the face size of a contract."
  },
  notional: {
    id: "notional", unit: 3, term: "notional",
    definition: "The face amount a derivative is written on — not what you paid.",
    example: "An option on $100,000 of stock might cost $2,000. Notional is $100k. Premium is $2k.",
    mixUp: "premium",
    mixUpWhy: "Notional is the size of the underlying. Premium is what you paid for the contract."
  },
  premium: {
    id: "premium", unit: 3, term: "premium",
    definition: "What you pay for an option — the price of the insurance.",
    example: "That put costs $3 a share. The $3 is the premium.",
    mixUp: "yield",
    mixUpWhy: "Premium is the price of the contract. Yield is what an investment pays you over time."
  },
  yield: {
    id: "yield", unit: 3, term: "yield",
    definition: "What an investment pays you, as a percent of its price.",
    example: "A $100 bond that pays $5 a year yields 5%. Price falls to $50, yield is 10%.",
    mixUp: "duration",
    mixUpWhy: "Yield is the income rate. Duration is how much the price jumps when rates move."
  },
  duration: {
    id: "duration", unit: 3, term: "duration",
    definition: "How sensitive a bond's price is to interest-rate changes, in years.",
    example: "A 10-year duration bond drops about 10% if rates rise 1%. That's the rate bruise.",
    mixUp: "yield",
    mixUpWhy: "Duration is the bruise from rate moves. Yield is the coupon you collect."
  },
  "basis risk": {
    id: "basis risk", unit: 3, term: "basis risk",
    definition: "When your hedge doesn't move 1-for-1 with what you were trying to protect.",

    mixUpWhy: "A hedge is the protection. Basis risk is the gap when that protection doesn't track."

  long: {
    id: "long", unit: 4, term: "long",
    definition: "You own it, or you're betting it goes up.",
    example: "You bought 50 shares. You're long. You want the price higher.",
    mixUp: "short selling",
    mixUpWhy: "Long = you want it up. Short = you want it down."
  },
  volatility: {
    id: "volatility", unit: 4, term: "volatility",
    definition: "How violently the price swings — the weather, not the direction.",
    example: "A stock that rips 8% some days is more volatile than a utility that moves 0.3%.",
    mixUp: "diversification",
    mixUpWhy: "Volatility is how hard one thing swings. Diversification is owning several so one swing doesn't sink you."
  },
  diversification: {
    id: "diversification", unit: 4, term: "diversification",

/* ========== STATE ========== */
function emptyStore() {
  return {
    xp: 0,
    streak: 0,
    lastPlayedDate: "",
    completedLessonIds: [],
    missedTermIds: [],
    seenTermIds: []
  };
}
function loadStore() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return emptyStore();
    const s = Object.assign(emptyStore(), JSON.parse(raw));
    s.completedLessonIds = s.completedLessonIds || [];
    s.missedTermIds = s.missedTermIds || [];
    s.seenTermIds = s.seenTermIds || [];
    return s;
  } catch (e) {
    return emptyStore();
  }
}
function saveStore() {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

let view = "learn";

let gQuery = "";
let practiceFocus = null;

const SNAKE = [0, 56, 8, -56];
const NICE = ["Nice.", "Exactly.", "You got it.", "Clean."];
const NOPE = ["Not quite.", "Mix-up.", "That pair again.", "Close, wrong fork."];

/* ========== HELPERS ========== */
function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pad(n) { return n < 10 ? "0" + n : "" + n; }
function todayStr() {
  const d = new Date();
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function yesterdayStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function lessonIndex(id) {
  return LESSONS.findIndex(function (l) { return l.id === id; });
}
function isUnlocked(i) {
  if (i <= 0) return true;
  return store.completedLessonIds.indexOf(LESSONS[i - 1].id) !== -1;
}
function isDone(id) {
  return store.completedLessonIds.indexOf(id) !== -1;
}
function nextUpId() {
  for (let i = 0; i < LESSONS.length; i++) {
    if (!isDone(LESSONS[i].id) && isUnlocked(i)) return LESSONS[i].id;
  }
  return null;
}
function realTermIds(p) {
  return (p.termIds || []).filter(function (id) { return !!TERMS[id]; });
}
function present(p) {
  const c = JSON.parse(JSON.stringify(p));
  if (c.type === "match") {
    c.left = shuffle(c.pairs.map(function (x) { return { id: x.id, text: x.left }; }));
    c.right = shuffle(c.pairs.map(function (x) { return { id: x.id, text: x.right }; }));
  }
  if (c.options) {
    c.correctText = c.options[c.answer];
    c.options = shuffle(c.options.slice());
  }
  if (c.type === "fill") c.bank = shuffle(c.bank.slice());
  return c;
}
function markSeen(p) {
  realTermIds(p).forEach(function (id) {
    if (store.seenTermIds.indexOf(id) === -1) store.seenTermIds.push(id);
  });
  saveStore();
}
function noteMiss(ids) {
  ids.forEach(function (id) {
    if (store.missedTermIds.indexOf(id) === -1) store.missedTermIds.push(id);
  });
}
function noteHit(ids) {
  ids.forEach(function (id) {
    const i = store.missedTermIds.indexOf(id);
    if (i !== -1) store.missedTermIds.splice(i, 1);
  });
}
function bumpStreak() {
  const today = todayStr();
  if (store.lastPlayedDate === today) return;
  if (store.lastPlayedDate === yesterdayStr()) store.streak += 1;
  else store.streak = 1;
  store.lastPlayedDate = today;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function heartRow(n, max) {
  max = max || 5;
  let h = "";
  for (let i = 0; i < max; i++) {
    h += i < n
      ? '<span style="color:var(--heart)">♥</span>'
      : '<span style="color:var(--heart-empty)">♥</span>';
  }
  return h;
}

/* ========== SESSION ========== */
function startLesson(id) {
  const lesson = LESSONS.find(function (l) { return l.id === id; });
  if (!lesson) return;
  const i = lessonIndex(id);
  if (!isUnlocked(i)) return;
  session = {
    lessonId: lesson.id,
    title: lesson.title,
    isPractice: false,
    prompts: lesson.prompts,
    index: 0,
    hearts: 5,
    results: [],
    phase: "answer",
    selection: null,
    presented: present(lesson.prompts[0]),
    matchLocked: [],
    matchL: null,
    matchR: null,
    shake: [],
    lastCorrect: false
  };
  markSeen(session.presented);
  view = "lesson";
  render();
}

function gatherPracticePrompts(focus) {
  const all = [];
  LESSONS.forEach(function (l) {
    l.prompts.forEach(function (p) { all.push(p); });
  });
  const focusSet = {};
  (focus && focus.length ? focus : store.missedTermIds).forEach(function (id) { focusSet[id] = true; });
  const hasFocus = Object.keys(focusSet).length > 0;
  let pool;
  if (hasFocus) {
    const weak = all.filter(function (p) {
      return realTermIds(p).some(function (id) { return focusSet[id]; });
    });
    const rest = all.filter(function (p) { return weak.indexOf(p) === -1; });
    pool = shuffle(weak).concat(shuffle(rest));
  } else {
    pool = shuffle(LESSONS.filter(function (l) { return l.unit === 1; }).reduce(function (a, l) {
      return a.concat(l.prompts);
    }, []));
  }
  const seen = {};
  const out = [];
  for (let i = 0; i < pool.length && out.length < 10; i++) {
    if (seen[pool[i].id]) continue;
    seen[pool[i].id] = true;
    out.push(pool[i]);
  }
  return out;
}

function startPractice(focus) {
  const prompts = gatherPracticePrompts(focus);
  session = {
    lessonId: "practice",
    title: "Practice",
    isPractice: true,
    prompts: prompts,
    index: 0,
    hearts: 5,
    results: [],
    phase: "answer",
    selection: null,
    presented: present(prompts[0]),
    matchLocked: [],
    matchL: null,
    matchR: null,
    shake: [],
    lastCorrect: false
  };
  markSeen(session.presented);
  view = "lesson";
  render();
}

function canCheck() {
  if (!session || session.phase !== "answer") return false;
  const p = session.presented;
  if (p.type === "match") return session.matchLocked.length === p.pairs.length;
  return session.selection !== null && session.selection !== undefined;
}

function isRight() {
  const p = session.presented;
  if (p.type === "match") return session.matchLocked.length === p.pairs.length;
  if (p.type === "truefalse") return session.selection === p.answer;
  if (p.type === "fill") return session.selection === p.answer;
  return session.selection === p.correctText;
}

function doCheck() {
  if (!canCheck()) return;
  const p = session.presented;
  const ok = isRight();
  const ids = realTermIds(p);
  session.lastCorrect = ok;
  session.results.push({ correct: ok, termIds: ids });
  if (ok) noteHit(ids);
  else {
    session.hearts -= 1;
    noteMiss(ids);
  }
  session.phase = "feedback";
  saveStore();
  render();
}

function doContinue() {
  if (!session || session.phase !== "feedback") return;
  if (!session.lastCorrect && session.hearts <= 0) {
    view = "fail";
    render();
    return;
  }
  const next = session.index + 1;
  if (next >= session.prompts.length) {
    finishLesson();
    return;
  }
  session.index = next;
  session.phase = "answer";
  session.selection = null;
  session.matchLocked = [];
  session.matchL = null;
  session.matchR = null;
  session.shake = [];
  session.presented = present(session.prompts[next]);
  markSeen(session.presented);
  render();
}

function finishLesson() {
  const total = session.results.length;
  const correct = session.results.filter(function (r) { return r.correct; }).length;
  const xpHit = correct * 10;
  const xpDone = 20;
  const xpPerfect = correct === total && total > 0 ? 20 : 0;
  const gained = xpHit + xpDone + xpPerfect;
  store.xp += gained;
  if (!session.isPractice) {
    if (store.completedLessonIds.indexOf(session.lessonId) === -1) {
      store.completedLessonIds.push(session.lessonId);
    }
  }
  bumpStreak();
  const missMap = {};
  session.results.forEach(function (r) {
    if (!r.correct) r.termIds.forEach(function (id) { missMap[id] = true; });
  });
  session.summary = {
    gained: gained,
    xpHit: xpHit,
    xpDone: xpDone,
    xpPerfect: xpPerfect,
    correct: correct,
    total: total,
    mix: Object.keys(missMap).slice(0, 3)
  };
  saveStore();
  view = "complete";
  render();
  burst();
}

function abandon() {
  session = null;
  view = tab === "practice" ? "practice-home" : tab === "glossary" ? "glossary" : "learn";
  render();
}

function burst() {
  const app = document.getElementById("app");
  const colors = ["#e0b422", "#2c6b4a", "#f3ead6", "#e25b4a", "#8fbc8f", "#f3d056"];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement("i");
    el.className = "bit";
    el.style.background = colors[i % colors.length];
    el.style.setProperty("--x", (Math.random() * 240 - 120) + "px");
    el.style.setProperty("--r", Math.random() * 400 + "deg");
    el.style.left = (40 + Math.random() * 20) + "%";
    el.style.top = "28%";
    app.appendChild(el);
    setTimeout(function (n) { return function () { n.remove(); }; }(el), 1200);
  }
}

function kickerFor(p) {
  const map = { meaning: "Meaning", match: "Match the pairs", fill: "Fill the blank", scenario: "Scenario", truefalse: "True or false" };
  return map[p.type] || "Prompt";
}

function renderPromptBody() {
  const p = session.presented;
  const locked = session.phase === "feedback";
  let h = '<div class="kicker2">' + kickerFor(p) + "</div>";
  if (p.type === "meaning") {
    h += '<div class="stem">' + esc(p.stem) + "</div>";
    h += renderOpts(p.options, p.correctText, false);
  } else if (p.type === "scenario") {
    h += '<div class="story">' + esc(p.story) + "</div>";
    h += '<div class="stem">' + esc(p.stem) + "</div>";
    h += renderOpts(p.options, p.correctText, false);
  } else if (p.type === "truefalse") {
    h += '<div class="stem">' + esc(p.stem) + "</div>";
    h += '<div class="tf">';
    h += tfBtn(true, p.answer, locked);
    h += tfBtn(false, p.answer, locked);
    h += "</div>";
  } else if (p.type === "fill") {
    const filled = session.selection || "";
    const story = esc(p.story).replace("____", '<span class="blank">' + (filled ? esc(filled) : " ") + "</span>");
    h += '<div class="story">' + story + "</div>";
    h += '<div class="bank">';
    p.bank.forEach(function (w) {
      let cls = "bank-chip";
      if (session.selection === w) cls += " sel";
      if (locked && w === p.answer) cls += " good";
      if (locked && session.selection === w && w !== p.answer) cls += " bad";
      h += '<button class="' + cls + '" data-act="pick" data-val="' + esc(w) + '"' + (locked ? " disabled" : "") + ">" + esc(w) + "</button>";
    });
    h += "</div>";
  } else if (p.type === "match") {
    h += '<div class="stem">Tap a term, then its match.</div>';
    h += '<div class="match">';
    h += '<div>' + p.left.map(function (c) { return mchip(c, "L"); }).join("") + "</div>";
    h += '<div>' + p.right.map(function (c) { return mchip(c, "R"); }).join("") + "</div>";
    h += "</div>";
  }
  return h;
}

function renderOpts(opts, correctText, isTf) {
  let h = '<div class="opts">';
  opts.forEach(function (o, i) {
    let cls = "opt";
    const selected = session.selection === o;
    if (selected) cls += " sel";
    if (session.phase === "feedback") {
      if (o === correctText) cls += " good";
      else if (selected) cls += " bad";
    }
    h += '<button class="' + cls + '" data-act="pick" data-val="' + esc(o) + '" data-n="' + (i + 1) + '"' +
      (session.phase === "feedback" ? " disabled" : "") + "><small style='opacity:.45;font-weight:800;margin-right:8px'>" + (i + 1) + "</small>" + esc(o) + "</button>";
  });
  h += "</div>";
  return h;
}

function tfBtn(val, answer, locked) {
  let cls = "opt";
  if (session.selection === val) cls += " sel";
  if (locked) {
    if (val === answer) cls += " good";
    else if (session.selection === val) cls += " bad";
  }
  return '<button class="' + cls + '" data-act="pick" data-val="' + val + '"' + (locked ? " disabled" : "") + ">" + (val ? "True" : "False") + "</button>";
}

function mchip(c, side) {
  const locked = session.matchLocked.indexOf(c.id) !== -1;
  const sel = (side === "L" ? session.matchL : session.matchR) === c.id;
  let cls = "mchip";
  if (locked || (session.phase === "feedback" && locked)) cls += " good";
  if (sel && !locked) cls += " sel";
  if (session.shake.indexOf(side + c.id) !== -1) cls += " shake";
  const act = session.phase === "answer" && !locked ? ' data-act="m" data-side="' + side + '" data-id="' + esc(c.id) + '"' : "";
  return '<button class="' + cls + '"' + act + ' style="width:100%;margin-bottom:8px">' + esc(c.text) + "</button>";
}

function renderLesson() {
  const n = session.prompts.length;
  let pips = '<div class="pips">';
  for (let i = 0; i < n; i++) {
    pips += '<div class="pip' + (i < session.index ? " on" : i === session.index ? " now" : "") + '"></div>';
  }
  pips += "</div>";
  let html = '<div class="lesson">';
  html += '<div class="l-top"><button class="xbtn" data-act="abandon" aria-label="Close">×</button>' + pips +
    '<div class="hearts">' + heartRow(session.hearts) + "</div></div>";
  html += '<div class="prompt">' + renderPromptBody() + "</div>";
  if (session.phase === "answer") {
    html += '<div class="foot"><button class="btn btn-gold" data-act="check"' + (canCheck() ? "" : " disabled") + ">Check</button></div>";
  } else {
    const ok = session.lastCorrect;
    html += '<div class="sheet ' + (ok ? "ok" : "no") + '">';
    html += "<h3>" + (ok ? pick(NICE) : pick(NOPE)) + "</h3>";
    html += "<p>" + esc(session.presented.why) + "</p>";
    html += '<button class="btn ' + (ok ? "btn-green" : "btn-red") + '" data-act="cont">Continue</button>';
    html += "</div>";
  }
  html += "</div>";
  return html;
}

function renderComplete() {
  const s = session.summary;
  const acc = s.total ? Math.round((s.correct / s.total) * 100) : 0;
  let html = '<div class="hero">';
  html += '<div class="mascot">' + hedgehog() + "</div>";
  html += "<h1>" + (s.xpPerfect ? "Flawless." : "Lesson done.") + "</h1>";
  html += '<p class="sub">' + acc + "% accuracy · " + s.correct + "/" + s.total + "</p>";
  html += '<div class="xp-card">';
  html += '<div class="xp-row"><span>Correct answers</span><span>+' + s.xpHit + " XP</span></div>";
  html += '<div class="xp-row"><span>Lesson complete</span><span>+' + s.xpDone + " XP</span></div>";
  if (s.xpPerfect) html += '<div class="xp-row"><span>No-mistake bonus</span><span>+' + s.xpPerfect + " XP</span></div>";
  html += '<div class="xp-row total"><span>Total</span><span>+' + s.gained + " XP</span></div>";
  html += "</div>";
  if (s.mix.length) {
    html += '<p class="sub" style="margin-bottom:8px">You mix these up</p><div class="chips">';
    s.mix.forEach(function (id) {
      const t = TERMS[id];
      if (!t) return;
      html += '<span class="chip">' + esc(t.term) + " vs " + esc(t.mixUp) + "</span>";
    });
    html += "</div>";
  }
  if (!session.isPractice) {
    const i = lessonIndex(session.lessonId);
    const nxt = LESSONS[i + 1];
    if (nxt) html += '<button class="btn btn-gold" data-act="start" data-id="' + nxt.id + '">Next: ' + esc(nxt.title) + "</button>";
    else html += '<button class="btn btn-gold" data-act="tab" data-tab="learn">Back to the path</button>';
    if (s.mix.length) html += '<button class="btn btn-ghost" data-act="practice-those">Practice those</button>';
    else html += '<button class="btn btn-ghost" data-act="tab" data-tab="learn">The path</button>';
  } else {
    html += '<button class="btn btn-gold" data-act="practice">Practice again</button>';
    html += '<button class="btn btn-ghost" data-act="tab" data-tab="learn">The path</button>';
  }
  html += "</div>";
  return html;
}

function renderFail() {
  let html = '<div class="hero">';
  html += '<div class="mascot">💔</div>';
  html += "<h1>Out of hearts.</h1>";
  html += '<p class="sub">That mix-up got you. Retry — hearts refill now. No wait.</p>';
  if (session.isPractice) {
    html += '<button class="btn btn-gold" data-act="practice">Retry practice</button>';
  } else {
    html += '<button class="btn btn-gold" data-act="start" data-id="' + session.lessonId + '">Retry lesson</button>';
  }
  html += '<button class="btn btn-ghost" data-act="tab" data-tab="learn">Back to the path</button>';
  html += "</div>";
  return html;
}

function render() {
  const app = document.getElementById("app");
  let html;
  if (view === "learn") html = renderLearn();
  else if (view === "practice-home") html = renderPracticeHome();
  else if (view === "glossary") html = renderGlossary();
  else if (view === "lesson") html = renderLesson();
  else if (view === "complete") html = renderComplete();
  else if (view === "fail") html = renderFail();
  else html = renderLearn();
  app.innerHTML = html;
  if (view === "glossary") {
    const inp = document.getElementById("g-q");
    if (inp && inp.addEventListener) {
      if (inp.focus) try { inp.focus(); } catch (e) {}
      inp.addEventListener("input", function () {
        gQuery = inp.value;
        const pos = inp.selectionStart;
        render();
        const n = document.getElementById("g-q");
        if (n && n.focus) {
          try { n.focus(); if (n.setSelectionRange) n.setSelectionRange(pos, pos); } catch (e) {}
        }
      });
    }
  }
}

/* ========== EVENTS ========== */
function onMatch(side, id) {
  if (session.phase !== "answer") return;
  if (session.matchLocked.indexOf(id) !== -1) return;
  if (side === "L") session.matchL = id;
  else session.matchR = id;
  if (session.matchL && session.matchR) {
    if (session.matchL === session.matchR) {
      session.matchLocked.push(session.matchL);
      session.matchL = null;
      session.matchR = null;
      session.shake = [];
    } else {
      const a = session.matchL, b = session.matchR;
      session.shake = ["L" + a, "R" + b];
      session.matchL = null;
      session.matchR = null;
      render();
      setTimeout(function () {
        if (session) { session.shake = []; render(); }
      }, 380);
      try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
      return;
    }
  }
  render();
}

document.getElementById("app").addEventListener("click", function (e) {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  if (act === "tab") {
    tab = t.dataset.tab;
    session = null;
    if (tab === "learn") view = "learn";
    else if (tab === "practice") view = "practice-home";
    else view = "glossary";
    render();
  } else if (act === "start") {
    startLesson(t.dataset.id);
  } else if (act === "practice") {
    practiceFocus = null;
    startPractice(null);
  } else if (act === "practice-those") {
    const focus = (session && session.summary && session.summary.mix) || store.missedTermIds;
    startPractice(focus);
  } else if (act === "abandon") {
    abandon();
  } else if (act === "pick") {
    if (!session || session.phase !== "answer") return;
    const p = session.presented;
    if (p.type === "truefalse") session.selection = t.dataset.val === "true";
    else session.selection = t.dataset.val;
    render();
  } else if (act === "m") {
    onMatch(t.dataset.side, t.dataset.id);
  } else if (act === "check") {
    doCheck();
  } else if (act === "cont") {
    doContinue();
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key === "Enter") {
    if (view === "lesson") {
      e.preventDefault();
      if (session.phase === "answer") doCheck();
      else doContinue();
    } else if (view === "complete" || view === "fail") {
      const btn = document.querySelector(".hero .btn");
      if (btn) btn.click();
    }
    return;
  }
  if (view !== "lesson" || session.phase !== "answer") return;
  if (e.key >= "1" && e.key <= "4") {
    const p = session.presented;
    const n = Number(e.key) - 1;
    if (p.type === "truefalse") {
      if (n === 0) session.selection = true;
      if (n === 1) session.selection = false;
      render();
    } else if (p.type === "fill") {
      if (p.bank[n] !== undefined) { session.selection = p.bank[n]; render(); }
    } else if (p.options && p.options[n] !== undefined) {
      session.selection = p.options[n];
      render();
    }
  }
});

render();
})();
</script>
</body>
</html>

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# main 上的每个提交都必须完整跑完，因此只在非 main 分支取消进行中的运行。
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # 只改文档的提交不跑代码检查，但必须让必需检查有结论，否则 PR 会一直卡在 pending。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
    steps:
      # paths-filter 需要能 fetch 基线 commit；私有仓在禁用凭据后无法认证拉取。
      # 这个 job 只跑 checkout + paths-filter，不执行仓库代码，因此保留凭据。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'workflow_dispatch'
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # 默认是 some（任一规则命中即匹配），那样 '**' 会先命中一切、排除规则失效。
          # 用 every 让所有规则都必须命中：排除项才能真正把文档类路径剔除。
          # 任何非文档文件都会命中 '**' 且不被排除，因此不会漏跑代码检查。
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
      - id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=${{ steps.filter.outputs.code }}" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from packageManager in package.json (single source of truth)
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check

  browser:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Production browser checks / desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 缓存浏览器本体，避免网络抖动时重下。
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pw-${{ runner.os }}-
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7

  # 唯一可以配置为必需检查的 job：无论代码是否被跳过都给出结论。
  ci-gate:
    if: always()
    needs: [changes, check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required checks
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::path filter job did not succeed (${{ needs.changes.result }})"
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" = "false" ]; then
            echo "Docs-only change: code checks skipped by design."
            exit 0
          fi
          for result in "${{ needs.check.result }}" "${{ needs.browser.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::code checks did not pass ($result)"
              exit 1
            fi
          done
